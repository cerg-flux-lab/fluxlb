name: Bug report
description: Something is broken or behaving incorrectly.
title: "[bug] "
labels: []
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What went wrong, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest code or command that reproduces it.
      render: python
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      value: |
        - OS:
        - Python:
        - PyTorch / CUDA:
        - GPU:
        - Qiskit (if relevant):
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / traceback
      render: shell
