name: Feature request
description: Propose a capability or improvement.
title: "[feature] "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: track
    attributes:
      label: Track
      options:
        - Classical core
        - SciML
        - Quantum
        - Tooling / infra
        - Docs
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
