# Documentation: Sphinx API reference plus the LaTeX user guide PDF, published to GitHub Pages.
# Pull requests build only; pushes to main deploy. The site is the API reference; the
# narrative and theory live in the PDF (docs/guide), which is copied into the site.
name: Docs

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docs/**"
      - "fluxlb/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  build:
    name: Build site and guide PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # setuptools-scm needs history for the version

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (CPU torch, docs extra)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[docs]"

      - name: Build Sphinx site
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Build user guide PDF
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: docs/guide
          root_file: main.tex
          latexmk_use_lualatex: false

      - name: Add PDF to site
        run: |
          mkdir -p docs/_build/html/guide
          cp docs/guide/main.pdf docs/_build/html/guide/fluxlb-guide.pdf

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/html

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
